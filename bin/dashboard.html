<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyPeople - HUD</title><style>
:root{--midnight:#01000A;--volt:#D5EF8A;--grove:#5e7a5e;--iris:#C4BFFF;--dark-bg:#111110;--text-dark:#F0F0E8;--muted-dark:rgba(240,240,232,0.45);--surface:rgba(255,255,255,0.05);--surface2:rgba(255,255,255,0.08);--dark-border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.15);--volt-dim:rgba(213,239,138,0.15);--volt-glow:rgba(213,239,138,0.25);--success:#34c759;--danger:#ff3b30;--warning:#febc2e;--info:#5ac8fa;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono','SF Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--dark-bg);color:var(--text-dark);font-family:var(--sans)}.wrap{max-width:1500px;margin:auto;padding:42px 25px}h1{font:400 38px var(--serif);margin:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:end}.meta{font:12px var(--mono);color:var(--muted-dark);text-transform:uppercase;margin-top:6px}.nav{color:var(--volt);font:12px var(--mono);text-transform:uppercase}section{margin-top:30px;background:var(--surface);border:1px solid var(--dark-border);border-radius:18px;overflow:hidden}h2{font:400 26px var(--serif);margin:18px 20px}table{border-collapse:collapse;width:100%}th,td{padding:12px 14px;border-top:1px solid var(--dark-border);vertical-align:top;text-align:left}th{font:10px var(--mono);letter-spacing:.08em;color:var(--muted-dark)}td{font-size:14px}.aid,.cmd{font:12px var(--mono)}.cmd{display:block;max-width:430px;white-space:pre-wrap;word-break:break-all;color:var(--muted-dark)}.state.alive{color:var(--volt)}.status{display:inline-flex;border-radius:100px;padding:4px 8px;font:10px var(--mono);text-transform:uppercase}.status.working{color:var(--warning);background:rgba(254,188,46,.18)}.status.idle{color:var(--muted-dark);background:var(--surface)}.status.blocked{color:var(--danger);background:rgba(255,59,48,.16)}.status.ready{color:var(--volt);background:var(--volt-dim)}.attach,.revive,.copy{display:inline-block;border:0;border-radius:9px;padding:7px 10px;background:var(--volt);color:var(--midnight);font:700 11px var(--mono);text-decoration:none;cursor:pointer}.copy{padding:3px 6px;margin-left:6px;background:var(--surface2);color:var(--volt)}.empty{padding:20px;color:var(--muted-dark)}@media(max-width:900px){.tablewrap{overflow:auto}table{min-width:1150px}}
#combatStatus{border-color:rgba(213,239,138,.18);background:#15150f}.combat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}.combat-head h2{margin:0}.telemetry-state{font:700 10px var(--mono);letter-spacing:.12em;color:var(--volt)}.telemetry-state.stale{color:var(--warning)}.telemetry-cards{display:flex;gap:10px;overflow-x:auto;padding:14px 20px 20px}.combat-card{min-width:250px;max-width:310px;flex:1 0 250px;text-align:left;color:var(--text-dark);background:#1a1a14;border:1px solid rgba(213,239,138,.22);border-radius:10px;padding:13px 14px;cursor:pointer}.combat-card:hover,.combat-card:focus-visible{border-color:var(--volt);background:#202018;outline:none}.combat-title{display:flex;align-items:center;gap:8px;font:700 12px var(--mono);text-transform:uppercase}.combat-dot{width:7px;height:7px;border-radius:50%;background:var(--warning)}.combat-card.authenticated .combat-dot{background:var(--success);animation:combatPulse 1.8s ease-in-out infinite}.combat-card.quota_exhausted .combat-dot{background:#f59e0b}.combat-card.expired .combat-dot,.combat-card.unreachable .combat-dot,.combat-card.process_dead .combat-dot{background:var(--danger)}.telemetry-stale .combat-dot{animation:none!important}.combat-health{margin-left:auto;font:700 9px var(--mono);color:var(--muted-dark)}.combat-data{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:12px}.combat-data span{min-width:0;font:10px var(--mono);color:var(--muted-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.combat-data strong{display:block;margin-top:2px;color:var(--text-dark);font-weight:500}.combat-usage{grid-column:1/-1}.health{font:700 10px var(--mono);text-transform:uppercase}.health.authenticated{color:var(--success)}.health.unknown{color:var(--warning)}.health.quota_exhausted{color:#f59e0b}.health.expired,.health.unreachable,.health.process_dead{color:var(--danger)}tr.selected-agent{background:rgba(213,239,138,.09);box-shadow:inset 3px 0 var(--volt)}@keyframes combatPulse{50%{opacity:.42;transform:scale(.82)}}@media(prefers-reduced-motion:reduce){.combat-card,.combat-dot{animation:none!important}}
</style><link rel="stylesheet" href="/assets/mypeople-ui.css"></head><body><main class="wrap"><header class="top"><div><h1>MyPeople - HUD</h1><div class="meta"><span id="count">0 agents</span> · refreshed <span id="refreshed">—</span> · <span id="live">live</span></div></div><a class="nav" href="/">TODO ↗</a></header><section id="combatStatus"><div class="combat-head"><h2>Combat Status</h2><span id="telemetryState" class="telemetry-state">LIVE</span></div><div id="telemetryCards" class="telemetry-cards"><div class="empty">No active provider telemetry</div></div></section><section><h2>Agents</h2><div class="tablewrap"><table id="agentsTable"><thead><tr><th>AGENT_ID</th><th>STATE</th><th>STATUS</th><th>BACKEND</th><th>MODEL</th><th>HEALTH</th><th>BOSS</th><th>SUMMARY</th><th>SPAWN CMD</th><th>ATTACH</th></tr></thead><tbody></tbody></table></div></section><section><h2>Retired engineers</h2><div class="tablewrap"><table id="retiredTable"><thead><tr><th>AGENT_ID</th><th>SUMMARY</th><th>SPAWN CMD</th><th>REVIVE</th></tr></thead><tbody></tbody></table></div></section></main><script>
'use strict';const $=s=>document.querySelector(s);let agents=[],roster=[],lastTelemetry={agents:[]},telemetryStale=false;
async function get(p,o){const r=await fetch(p,{credentials:'same-origin',cache:'no-store',...(o||{})});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function cmdCell(row){const td=el('td'),s=el('code','cmd',row.spawn_cmd||'');s.title=row.spawn_cmd||'';const c=el('button','copy','copy');c.onclick=()=>navigator.clipboard?.writeText(row.spawn_cmd||'');const rev=el('code','cmd',row.revive_cmd||('mp revive '+row.agent_id));td.append(s,c,rev);return td}
function attachUrl(a){return '/todo/terminal?agent='+encodeURIComponent(a.agent_id)}
function tokenCount(value){if(!Number.isSafeInteger(value)||value<0)return 'not measured';if(value<1000)return String(value);return (value/1000).toFixed(value<10000?1:0).replace('.0','')+'k'}
function telemetryMap(){return new Map((lastTelemetry.agents||[]).map(x=>[x.agentId,x]))}
function selectAgent(agentId){document.querySelectorAll('#agentsTable tr.selected-agent').forEach(x=>x.classList.remove('selected-agent'));const row=[...document.querySelectorAll('#agentsTable tbody tr')].find(x=>x.dataset.agentId===agentId);if(row){row.classList.add('selected-agent');row.scrollIntoView({behavior:'smooth',block:'center'})}}
function renderTelemetry(){const root=$('#combatStatus'),cards=$('#telemetryCards'),state=$('#telemetryState');root.classList.toggle('telemetry-stale',telemetryStale);state.className='telemetry-state'+(telemetryStale?' stale':'');state.textContent=telemetryStale?'STALE':'LIVE';cards.replaceChildren();const rows=lastTelemetry.agents||[];if(!rows.length){cards.append(el('div','empty','No active provider telemetry'));return}for(const row of rows){const health=row.health||{state:'unknown',stale:true},healthState=health.state||'unknown';const card=el('button','combat-card '+healthState);card.type='button';card.onclick=()=>selectAgent(row.agentId);const title=el('div','combat-title'),dot=el('span','combat-dot'),name=el('span','',row.role+' · '+row.agentId.split(':').pop()),hs=el('span','combat-health',healthState);title.append(dot,name,hs);const data=el('div','combat-data');for(const [label,value] of [['provider',row.provider||'—'],['model',row.model||'—'],['profile',row.profile||'—'],['session',row.sessionAlias||'unavailable']]){const item=el('span','',label);item.append(el('strong','',value));data.append(item)}const measured=row.usage?.measurement==='measured';const usage=el('span','combat-usage','tokens');usage.append(el('strong','',measured?`${tokenCount(row.usage.inputTokens)} in / ${tokenCount(row.usage.outputTokens)} out`:'not measured'));data.append(usage);card.append(title,data);cards.append(card)}}
function render(){const tm=telemetryMap(),tb=$('#agentsTable tbody');tb.replaceChildren();for(const a of agents){const tr=el('tr');tr.dataset.agentId=a.agent_id;const telemetry=tm.get(a.agent_id)||{},health=telemetry.health?.state||'unknown';tr.append(el('td','aid',a.agent_id),el('td','state '+a.state,a.state),(()=>{const td=el('td');td.append(el('span','status '+(a.status||'ready'),a.status||'ready'));return td})(),el('td','',a.backend||''),el('td','model',telemetry.model||a.model||'—'),el('td','health '+health,health),el('td','aid',a.boss_id||'—'),el('td','',a.summary||''),cmdCell(a));const at=el('td'),url=attachUrl(a);if(url){const x=el('a','attach','ATTACH');x.href=url;x.target='_blank';x.rel='noopener noreferrer';at.append(x)}tr.append(at);tb.append(tr)}if(!agents.length){const tr=el('tr');const td=el('td','empty','No live agents');td.colSpan=10;tr.append(td);tb.append(tr)}const rt=$('#retiredTable tbody');rt.replaceChildren();for(const r of roster.filter(x=>x.retired)){const tr=el('tr');tr.dataset.agentId=r.agent_id;tr.append(el('td','aid',r.agent_id),el('td','',r.summary||''),cmdCell(r));const td=el('td'),b=el('button','revive','Revive');b.onclick=async()=>{await get('/revive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:r.agent_id})});await poll()};td.append(b);tr.append(td);rt.append(tr)}if(!rt.children.length){const tr=el('tr'),td=el('td','empty','No retired engineers');td.colSpan=4;tr.append(td);rt.append(tr)}$('#count').textContent=`${agents.length} agent${agents.length===1?'':'s'}`;$('#refreshed').textContent=new Date().toLocaleTimeString();renderTelemetry()}
async function poll(){try{const base=await Promise.all([get('/agents'),get('/roster')]);agents=base[0];roster=base[1];try{lastTelemetry=await get('/todo/operator-telemetry');telemetryStale=false}catch{telemetryStale=true}$('#live').textContent=telemetryStale?'stale':'live';render()}catch{telemetryStale=true;$('#live').textContent='stale';renderTelemetry()}}setInterval(poll,2500);poll();window.__hud={poll,get agents(){return agents},get roster(){return roster},get telemetry(){return lastTelemetry}};
</script></body></html>
