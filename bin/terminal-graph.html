<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyPeople - Graph</title>
  <link rel="stylesheet" href="/assets/mypeople-ui.css">
  <link rel="stylesheet" href="/assets/graph-canvas.css">
</head>
<body class="graph-page">
  <!--
  THESIS: This is a live command canvas, not a generic dashboard; operational truth appears before decoration.
  OWN-WORLD: Obsidian and charcoal surfaces, brass actions, jade health, ember risk, and terminal evidence with quiet depth.
  STORY: The operator can identify ownership, health, evidence, and the next terminal action in one glance.
  FIRST VIEWPORT: Identity and health sit in the top bar; Boss/Nightwatch and their terminal previews own the canvas; tools remain discoverable.
  FORM: Established-world refinement, chosen for clarity and low operational risk; seed key: impeccable-graph-polish.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <header class="graph-topbar">
    <a class="graph-brand" href="/">MyPeople</a>
    <a class="graph-nav-link" href="/terminal-graph">Graph</a>
    <a class="graph-nav-link" href="/dashboard">HUD</a>
    <nav class="graph-views" aria-label="Graph views">
      <button class="active" data-view="graph">Graph</button>
      <button data-view="mission">Mission</button>
      <button data-view="fleet">Fleet</button>
      <button data-view="attention">Attention</button>
      <button data-view="execution">Execution</button>
    </nav>
    <div class="graph-health">
      <span id="healthState">LOCAL / LIVE</span>
      <span id="offline">metadata offline</span>
    </div>
    <label class="graph-create"><span>NEW PRIORITY</span><input id="newTask" placeholder="Create task"></label>
    <button id="createTask" class="graph-button graph-button--gold">Create</button>
  </header>

  <aside id="layerRail" class="layer-rail" aria-label="Graph layers">
    <div class="rail-kicker">LAYERS</div>
    <label><input type="checkbox" data-layer="agents" checked><span>Agents</span><b>01</b></label>
    <label><input type="checkbox" data-layer="tasks" checked><span>Tasks</span><b>02</b></label>
    <label><input type="checkbox" data-layer="evidence" checked><span>Evidence</span><b>03</b></label>
    <label><input type="checkbox" data-layer="decisions" checked><span>Decisions</span><b>04</b></label>
    <label><input type="checkbox" data-layer="terminals" checked><span>Terminals</span><b>05</b></label>
    <button id="resetLayers" class="rail-reset">Reset layers</button>
  </aside>

  <main id="viewport" aria-label="MyPeople command canvas">
    <div id="world">
      <svg id="edges" aria-hidden="true"></svg>
      <section id="backlogZone" aria-label="Unassigned tasks">
        <div class="zone-kicker">QUEUE / UNASSIGNED</div>
        <h2>Backlog</h2>
        <div id="backlogList"></div>
      </section>
    </div>
  </main>

  <aside id="inspector" class="graph-inspector" aria-live="polite">
    <header><span>TASK INSPECTOR</span><button id="closeInspector" aria-label="Close inspector">×</button></header>
    <div id="inspectorBody" class="inspector-empty">Select an agent or task.</div>
  </aside>

  <aside id="minimap" class="graph-minimap" aria-label="Minimap">
    <header><span>MAP</span><span id="zoomReadout">100%</span></header>
    <div id="minimapViewport"></div>
    <div id="minimapNodes"></div>
  </aside>

  <nav id="canvasToolbar" class="canvas-toolbar" aria-label="Canvas tools">
    <button class="tool active" data-tool="select" title="Select">↖<span>Select</span></button>
    <button class="tool" data-tool="connect" title="Connect">⌁<span>Connect</span></button>
    <button class="tool" data-tool="task" title="Create task">□<span>Task</span></button>
    <button class="tool" data-tool="frame" title="Fit canvas">▣<span>Frame</span></button>
    <button id="fit" class="tool" title="Fit graph">⌗<span>Fit</span></button>
    <button id="boss" class="tool" title="Center Boss">♛<span>Boss</span></button>
  </nav>

  <section id="full" class="terminal-fullscreen" aria-hidden="true">
    <button id="closeFull">Close</button>
    <iframe title="interactive terminal"></iframe>
  </section>

  <section id="taskModal" class="task-modal" aria-hidden="true">
    <article class="panel">
      <header><h2 id="ptitle"></h2><button id="pclose" aria-label="Close task">×</button></header>
      <div id="pid" class="modal-id"></div>
      <div id="powner" class="owner-line"></div>
      <div class="row">
        <input id="ptext" aria-label="Title">
        <input id="pdone" placeholder="Done condition" aria-label="Done condition">
        <select id="pstate" aria-label="State">
          <option value="needs_brainstorm">needs brainstorm</option><option value="working">working</option>
          <option value="review">review</option><option value="blocked">blocked</option>
          <option value="recurring">recurring</option><option value="done">done</option><option value="cancelled">cancelled</option>
        </select>
        <button id="psave">Save</button><button id="pdelete" class="danger">Delete</button>
      </div>
      <div class="timeline" id="ptimeline"></div>
      <div class="row">
        <textarea id="pcomment" placeholder="Comment or instruct…"></textarea>
        <button id="ppost">Send</button>
        <label class="action-link">Evidence<input id="pfile" type="file" multiple hidden></label>
        <a id="pattach" class="action-link" target="_blank" rel="noopener">Owner terminal</a>
      </div>
    </article>
  </section>

  <script>
  'use strict';
  const SCALE=.38,CW=9,CH=18,PAD=6,VIEW_COLS=120,VIEW_ROWS=36;
  const POSKEY='mp_graph_canvas_v1',CAMERAKEY='mp_graph_camera_v1',LAYERKEY='mp_graph_layers_v1';
  const agentNodes=new Map(),taskNodes=new Map();
  let graph={agents:[],edges:[],tasks:[]},board={tasks:{}},selected=null,activeTool='select',activeView='graph';
  let layers=readJson(LAYERKEY,{agents:true,tasks:true,evidence:true,decisions:true,terminals:true});
  let transform=readJson(CAMERAKEY,{x:innerWidth/2,y:160,z:1}),drag=null,pan=null,openTask='';
  const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
  function readJson(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'null');return value&&typeof value==='object'?value:fallback}catch{return fallback}}
  function saveJson(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
  function api(path,body){const o={credentials:'same-origin',cache:'no-store'};if(body!==undefined){o.method='POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(body)}return fetch(path,o).then(r=>r.json().then(j=>{if(!r.ok)throw Error(j.error||r.status);return j}))}
  function term(port,target){const u=new URL(location.protocol+'//'+location.hostname+':'+port+'/');u.search='?arg=-t&arg='+encodeURIComponent(target);return u.href}
  function applyWorld(){ $('#world').style.transform='translate('+transform.x+'px,'+transform.y+'px) scale('+transform.z+')';$('#viewport').scrollLeft=0;$('#viewport').scrollTop=0;$('#zoomReadout').textContent=Math.round(transform.z*100)+'%';saveJson(CAMERAKEY,transform) }
  function agentRole(a){return a.role||(a.is_master?'boss':(/:Nightwatch$/.test(a.agent_id||'')?'nightwatch':'worker'))}
  function agentLabel(a){const role=agentRole(a);if(role==='boss')return 'Boss';if(role==='nightwatch')return 'Nightwatch';const raw=(a.agent_id||'Worker').split(':').pop();return raw.replace(/^Worker[-_ ]?/i,'Worker ')}
  function taskKind(t){return t.card_kind||({blocked:'BLOCKED',review:'REVIEW',done:'DELIVERED'}[t.state]||(t.proof_count?'EVIDENCE':'PRIORITY'))}
  function makeAgent(a){
    const n=document.createElement('article');n.className='node agent-node';n.dataset.agentId=a.agent_id;
    n.innerHTML='<div class="titlebar"><span class="dot"></span><span class="name"></span><span class="role"></span><span class="state"></span></div><div class="agent-summary"></div><div class="screen"><iframe title="agent observer"></iframe></div><div class="node-footer"><span class="capability"></span><span class="terminal-link">OPEN TERMINAL ↗</span></div>';
    const frame=n.querySelector('iframe');frame.dataset.target=a.target;frame.src=term(a.read_port,a.target);n.querySelector('.screen').onclick=()=>openFull(a);
    n.querySelector('.titlebar').onpointerdown=e=>startDrag(e,a.agent_id);n.onclick=e=>{if(!e.target.closest('.screen'))selectAgent(a.agent_id)};
    $('#world').append(n);const o={el:n,frame,a,x:0,y:0,w:0,h:0,depth:0};agentNodes.set(a.agent_id,o);return o
  }
  function updateAgent(o,a){
    o.a=a;const role=agentRole(a),boss=role==='boss';o.el.dataset.state=a.state||'idle';o.el.dataset.role=role;
    o.el.classList.toggle('node--boss',boss);o.el.classList.toggle('node--nightwatch',role==='nightwatch');o.el.classList.toggle('node--worker',role==='worker');
    o.el.querySelector('.name').textContent=agentLabel(a);o.el.querySelector('.role').textContent=(role+' / '+(a.backend||'local')).toUpperCase();o.el.querySelector('.state').textContent=(a.status||a.state||'idle').toUpperCase();
    o.el.querySelector('.agent-summary').textContent=a.summary||'local runtime · '+(a.target||a.agent_id||'unknown target');
    o.el.querySelector('.capability').textContent=role==='boss'?'COMMAND':role==='nightwatch'?'OVERSIGHT':'WORKER';
    const width=boss?370:286,rw=VIEW_COLS*CW,rh=VIEW_ROWS*CH,scale=boss?.34:.30,h=Math.round(rh*scale);
    o.el.style.width=width+'px';o.el.querySelector('.screen').style.width=Math.round(rw*scale)+PAD*2+'px';o.el.querySelector('.screen').style.height=h+PAD*2+'px';
    o.frame.style.cssText='left:'+PAD+'px;top:'+PAD+'px;width:'+rw+'px;height:'+rh+'px;transform:scale('+scale+')';o.w=width;o.h=h+76
  }
  function makeTask(t){
    const n=document.createElement('article');n.className='task-node';n.dataset.taskId=t.id;
    n.innerHTML='<div class="task-head"><span class="task-kind"></span><span class="task-state"></span></div><div class="task-title"></div><div class="task-meta"><span class="task-owner"></span><span class="task-proof"></span></div><div class="task-id"></div>';
    n.onclick=()=>selectTask(t.id);n.onpointerdown=e=>{if(e.button!==0)return;e.stopPropagation();const p={x:parseFloat(n.style.left)||0,y:parseFloat(n.style.top)||0};n.setPointerCapture(e.pointerId);drag={type:'task',id:t.id,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y};n.onpointermove=moveDrag;n.onpointerup=endDrag};taskNodes.set(t.id,n);return n
  }
  function updateTask(n,t){
    const kind=taskKind(t);n.dataset.state=t.state||'needs_brainstorm';n.dataset.kind=kind;
    n.querySelector('.task-kind').textContent=kind;n.querySelector('.task-state').textContent=(t.state||'queued').toUpperCase();
    n.querySelector('.task-title').textContent=t.title||t.text||'Untitled task';n.querySelector('.task-owner').textContent=t.assignee||'unassigned';
    n.querySelector('.task-proof').textContent=(t.proof_count||0)+' proof';n.querySelector('.task-id').textContent=t.id;n.hidden=!layers.tasks||!taskVisible(t)
  }
  function taskVisible(t){const kind=taskKind(t);if(kind==='EVIDENCE'&&!layers.evidence)return false;if(kind==='REVIEW'&&!layers.decisions)return false;return true}
  function positions(){return readJson(POSKEY,{agents:{},tasks:{}})}
  function layout(){
    const saved=positions(),boss=[...agentNodes.values()].find(o=>agentRole(o.a)==='boss'),nw=[...agentNodes.values()].find(o=>agentRole(o.a)==='nightwatch'),workers=[...agentNodes.values()].filter(o=>agentRole(o.a)==='worker').sort((a,b)=>a.a.agent_id.localeCompare(b.a.agent_id));
    if(boss){const p=saved.agents[boss.a.agent_id]||{x:-220,y:250};boss.x=p.x;boss.y=p.y;boss.el.style.left=boss.x+'px';boss.el.style.top=boss.y+'px'}
    if(nw){const p=saved.agents[nw.a.agent_id]||{x:-120,y:-100};nw.x=p.x;nw.y=p.y;nw.el.style.left=nw.x+'px';nw.el.style.top=nw.y+'px'}
    workers.forEach((o,i)=>{const p=saved.agents[o.a.agent_id]||{x:330,y:60+i*(o.h+70)};o.x=p.x;o.y=p.y;o.el.style.left=o.x+'px';o.el.style.top=o.y+'px'});
    const byOwner=new Map();for(const t of graph.tasks){const n=taskNodes.get(t.id)||makeTask(t);updateTask(n,t);if(t.owner_live&&agentNodes.has(t.assignee)){if(!byOwner.has(t.assignee))byOwner.set(t.assignee,[]);byOwner.get(t.assignee).push({t,n})}else{$('#backlogList').append(n);n.classList.add('backlog-item');n.dataset.depth='backlog'}}
    byOwner.forEach((items,owner)=>{const o=agentNodes.get(owner);items.forEach(({t,n},i)=>{const p=saved.tasks[t.id]||{x:o.x+o.w+130,y:o.y+i*150};n.classList.remove('backlog-item');$('#world').append(n);n.style.left=p.x+'px';n.style.top=p.y+'px';n.dataset.depth='task';n._graphPosition=p})});
    $('#backlogZone').style.left='-520px';$('#backlogZone').style.top='220px';drawEdges();renderMinimap();applyVisibility()
  }
  function box(el){return{x:parseFloat(el.style.left)||0,y:parseFloat(el.style.top)||0,w:el.offsetWidth,h:el.offsetHeight}}
  function edgePath(a,b){const sx=a.x+a.w,sy=a.y+a.h/2,tx=b.x,ty=b.y+b.h/2,mid=sx+(tx-sx)/2;return 'M '+sx+' '+sy+' C '+mid+' '+sy+', '+mid+' '+ty+', '+tx+' '+ty}
  function addEdge(svg,a,b,kind,label){
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',edgePath(a,b));path.setAttribute('class','edge edge-'+kind.toLowerCase());path.dataset.kind=kind;path.dataset.label=label||kind;svg.append(path);
    const text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('x',(a.x+a.w+b.x)/2);text.setAttribute('y',(a.y+a.h/2+b.y+b.h/2)/2-7);text.setAttribute('class','edge-label');text.textContent=label||kind;svg.append(text)
  }
  function drawEdges(){
    const svg=$('#edges');svg.replaceChildren();const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');defs.innerHTML='<marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z"></path></marker>';svg.append(defs);
    graph.edges.forEach(e=>{const p=agentNodes.get(e.parent),c=agentNodes.get(e.child);if(p&&c&&layers.agents)addEdge(svg,box(p.el),box(c.el),e.kind||'ASSIGNS',e.kind||'ASSIGNS')});
    graph.tasks.forEach(t=>{const p=agentNodes.get(t.assignee),n=taskNodes.get(t.id);if(p&&n&&!n.hidden&&layers.agents&&layers.tasks)addEdge(svg,box(p.el),box(n),t.state==='blocked'?'BLOCKS':'ASSIGNS',t.state==='blocked'?'BLOCKS':'ASSIGNS')});
    svg.style.left='-3000px';svg.style.top='-1200px';svg.setAttribute('width','7000');svg.setAttribute('height','6000');svg.setAttribute('viewBox','-3000 -1200 7000 6000');$('#viewport').scrollLeft=0;$('#viewport').scrollTop=0
  }
  function saveAgentPosition(id,o){const s=positions();s.agents[id]={x:o.x,y:o.y};saveJson(POSKEY,s)}
  function saveTaskPosition(id,n){const s=positions();s.tasks[id]={x:parseFloat(n.style.left)||0,y:parseFloat(n.style.top)||0};saveJson(POSKEY,s)}
  function startDrag(e,id){e.stopPropagation();const o=agentNodes.get(id);if(!o)return;e.currentTarget.setPointerCapture(e.pointerId);drag={type:'agent',id,startX:e.clientX,startY:e.clientY,x:o.x,y:o.y};e.currentTarget.onpointermove=moveDrag;e.currentTarget.onpointerup=endDrag}
  function moveDrag(e){if(!drag)return;const scale=transform.z;if(drag.type==='agent'){const o=agentNodes.get(drag.id);o.x=drag.x+(e.clientX-drag.startX)/scale;o.y=drag.y+(e.clientY-drag.startY)/scale;o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';saveAgentPosition(drag.id,o)}else{const n=taskNodes.get(drag.id);if(!n)return;const x=drag.x+(e.clientX-drag.startX)/scale,y=drag.y+(e.clientY-drag.startY)/scale;n.style.left=x+'px';n.style.top=y+'px';saveTaskPosition(drag.id,n)}drawEdges();renderMinimap()}
  function endDrag(e){if(!drag)return;drag=null;if(e.currentTarget){e.currentTarget.onpointermove=null;e.currentTarget.onpointerup=null}}
  function selectAgent(id){selected={type:'agent',id};agentNodes.forEach(o=>o.el.classList.toggle('selected',o.a.agent_id===id));taskNodes.forEach(n=>n.classList.remove('selected'));renderInspector()}
  function selectTask(id){selected={type:'task',id};taskNodes.forEach(n=>n.classList.toggle('selected',n.dataset.taskId===id));agentNodes.forEach(o=>o.el.classList.remove('selected'));renderInspector()}
  function row(label,value){const d=document.createElement('div');d.className='inspector-row';const k=document.createElement('span');k.textContent=label;const v=document.createElement('strong');v.textContent=value||'—';d.append(k,v);return d}
  function renderInspector(){
    const body=$('#inspectorBody');body.replaceChildren();if(!selected){body.className='inspector-empty';body.textContent='Select an agent or task.';return}body.className='inspector-content';
    if(selected.type==='agent'){const a=graph.agents.find(x=>x.agent_id===selected.id);if(!a)return;body.append(row('ROLE',agentRole(a).toUpperCase()),row('STATE',(a.status||a.state||'idle').toUpperCase()),row('BACKEND',a.backend||'local'),row('AGENT ID',a.agent_id),row('SUMMARY',a.summary));const link=document.createElement('a');link.className='inspector-action';link.href='/todo/terminal?agent='+encodeURIComponent(a.agent_id);link.target='_blank';link.rel='noopener';link.textContent='Open owner terminal ↗';body.append(link);return}
    const t=graph.tasks.find(x=>x.id===selected.id),full=board.tasks[selected.id];if(!t)return;body.append(row('CARD KIND',taskKind(t)),row('STATUS',(t.state||'queued').toUpperCase()),row('OWNER',t.assignee||'unassigned'),row('DONE CONDITION',t.done_condition||full?.doneCondition||''),row('PROJECT',t.project_slug||full?.projectSlug||''),row('EVIDENCE',String(t.proof_count||0)+' proof'));const action=document.createElement('button');action.className='inspector-action';action.textContent='Open full task';action.onclick=()=>openCard(t.id,true);body.append(action)
  }
  function applyVisibility(){
    agentNodes.forEach(o=>{o.el.hidden=!layers.agents;o.el.querySelector('.screen').hidden=!layers.terminals});
    taskNodes.forEach((n,id)=>{const t=graph.tasks.find(x=>x.id===id);n.hidden=!layers.tasks||!taskVisible(t||{});});drawEdges();renderMinimap()
  }
  function renderMinimap(){
    const target=$('#minimapNodes');target.replaceChildren();const all=[...agentNodes.values()].filter(o=>!o.el.hidden).map(o=>box(o.el)).concat([...taskNodes.values()].filter(n=>!n.hidden&&!n.classList.contains('backlog-item')).map(box));if(!all.length)return;
    const l=Math.min(...all.map(x=>x.x)),t=Math.min(...all.map(x=>x.y)),r=Math.max(...all.map(x=>x.x+x.w)),b=Math.max(...all.map(x=>x.y+x.h)),w=Math.max(1,r-l),h=Math.max(1,b-t);
    all.forEach(x=>{const m=document.createElement('i');m.style.left=((x.x-l)/w*180)+'px';m.style.top=((x.y-t)/h*120)+'px';m.style.width=Math.max(5,x.w/w*180)+'px';m.style.height=Math.max(4,x.h/h*120)+'px';target.append(m)});
    const vp=$('#minimapViewport');vp.style.left=Math.max(0,(-transform.x/transform.z-l)/w*180)+'px';vp.style.top=Math.max(0,(-transform.y/transform.z-t)/h*120)+'px'
  }
  function bounds(){const xs=[...agentNodes.values()].filter(o=>!o.el.hidden).map(o=>box(o.el));for(const n of taskNodes.values())if(!n.hidden&&!n.classList.contains('backlog-item'))xs.push(box(n));if(!xs.length)return{x:0,y:0,w:1,h:1};const l=Math.min(...xs.map(x=>x.x)),t=Math.min(...xs.map(x=>x.y)),r=Math.max(...xs.map(x=>x.x+x.w)),b=Math.max(...xs.map(x=>x.y+x.h));return{x:l,y:t,w:r-l,h:b-t}}
  function fit(){const b=bounds(),leftGutter=layers.agents?220:24,rightGutter=layers.tasks?330:24,topGutter=92,bottomGutter=100,usableW=Math.max(1,innerWidth-leftGutter-rightGutter),usableH=Math.max(1,innerHeight-topGutter-bottomGutter),z=Math.min(1,usableW/Math.max(1,b.w),usableH/Math.max(1,b.h));transform={z:z,x:leftGutter+usableW/2-(b.x+b.w/2)*z,y:topGutter+usableH/2-(b.y+b.h/2)*z};applyWorld();renderMinimap()}
  function centerBoss(){const o=[...agentNodes.values()].find(x=>agentRole(x.a)==='boss');if(!o)return;transform.z=Math.max(transform.z,.7);transform.x=innerWidth/2-(o.x+o.w/2)*transform.z;transform.y=innerHeight*.45-(o.y+o.h/2)*transform.z;applyWorld();renderMinimap()}
  function applyView(view){activeView=view;$$('.graph-views button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='fleet'){layers.tasks=false;layers.agents=true}else if(view==='attention'){layers.tasks=true;layers.agents=true;layers.evidence=false;layers.decisions=true}else if(view==='execution'){layers.tasks=true;layers.agents=true;layers.evidence=true;layers.decisions=false}else{layers.tasks=true;layers.agents=true;layers.evidence=true;layers.decisions=true}$$('[data-layer]').forEach(i=>i.checked=!!layers[i.dataset.layer]);saveJson(LAYERKEY,layers);applyVisibility();if(view==='mission')fit()}
  function openFull(a){const f=$('#full');f.classList.add('open');f.setAttribute('aria-hidden','false');f.dataset.target=a.target;f.querySelector('iframe').src=term(a.write_port,a.target);document.body.dataset.terminalAgent=a.agent_id}
  function closeFull(){$('#full').classList.remove('open');$('#full').setAttribute('aria-hidden','true');$('#full iframe').src='about:blank';delete document.body.dataset.terminalAgent}
  function renderCard(t){
    const isAgent=a=>/^[^\/\s]+\/[^:\s]+:[^\s]+$/.test(a||''),alink=(a,label)=>{const x=document.createElement('a');x.className='asg-link';x.href='/todo/terminal?agent='+encodeURIComponent(a);x.target='_blank';x.rel='noopener';x.textContent=label||a;return x};
    $('#ptitle').textContent=t.text;$('#pid').textContent=t.id;$('#ptext').value=t.text;$('#pdone').value=t.doneCondition||'';$('#pstate').value=t.state;
    const own=$('#powner');own.replaceChildren(document.createTextNode('Owner: '),isAgent(t.assignee)?alink(t.assignee):document.createTextNode(t.assignee||'unassigned'));const attach=$('#pattach');
    if(isAgent(t.assignee)){attach.href='/todo/terminal?agent='+encodeURIComponent(t.assignee);attach.removeAttribute('aria-disabled')}else{attach.removeAttribute('href');attach.setAttribute('aria-disabled','true')}
    const items=[...(t.comments||[]).map(x=>Object.assign({},x,{type:'comment'})),...(t.proofs||[]).map(x=>Object.assign({},x,{type:'proof'}))].sort((a,b)=>(a.ts||0)-(b.ts||0));const tl=$('#ptimeline');tl.replaceChildren();
    items.forEach(x=>{const d=document.createElement('div');d.className='item'+(x.type==='proof'?' evidence-card':'');if(x.type==='comment'){d.textContent=(x.by||'operator')+': '+(x.body||'')}else if(x.kind==='image'){const im=document.createElement('img');im.src=x.url;d.append(im)}else if(x.kind==='video'){const v=document.createElement('video');v.src=x.url;v.controls=true;d.append(v)}else if(x.kind==='link'){const l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent=x.url;d.append(l)}else if(x.kind==='file'){const l=document.createElement('a');l.href=x.url;l.download=x.filename||'artifact';l.className='evidence-file';l.textContent='↓ FILE · '+(x.filename||'artifact');d.append(l)}else d.textContent=x.body||'';tl.append(d)})
  }
  function openCard(id,push){const t=board.tasks[id];if(!t)return;openTask=id;$('#taskModal').classList.add('open');$('#taskModal').setAttribute('aria-hidden','false');renderCard(t);if(push){const u=new URL(location.href);u.searchParams.set('task',id);history.pushState({task:id},'',u)}}
  function closeCard(push){openTask='';$('#taskModal').classList.remove('open');$('#taskModal').setAttribute('aria-hidden','true');if(push!==false){const u=new URL(location.href);u.searchParams.delete('task');history.pushState({},'',u)}}
  function poll(){return Promise.all([api('/todo/terminal-graph'),api('/todo/board')]).then(values=>{graph=values[0];board=values[1];const seen=new Set();graph.agents.forEach(a=>{seen.add(a.agent_id);updateAgent(agentNodes.get(a.agent_id)||makeAgent(a),a)});agentNodes.forEach((o,id)=>{if(!seen.has(id)){o.el.remove();agentNodes.delete(id)}});const ts=new Set(graph.tasks.map(t=>t.id));taskNodes.forEach((n,id)=>{if(!ts.has(id)){n.remove();taskNodes.delete(id)}});layout();$('#offline').style.display='none';$('#healthState').textContent='LOCAL / LIVE';if(openTask&&board.tasks[openTask])renderCard(board.tasks[openTask]);renderInspector()}).catch(()=>{$('#offline').style.display='inline';$('#healthState').textContent='LOCAL / DEGRADED'})}
  $('#closeFull').onclick=closeFull;$('#pclose').onclick=()=>closeCard();$('#taskModal').onclick=e=>{if(e.target===$('#taskModal'))closeCard()};
  $('#psave').onclick=()=>api('/todo/update',{op:'set',id:openTask,text:$('#ptext').value,doneCondition:$('#pdone').value,state:$('#pstate').value,by:'CEO'}).then(()=>poll());
  $('#pdelete').onclick=()=>{if(confirm('Delete task?'))api('/todo/update',{op:'del',id:openTask}).then(()=>{closeCard();return poll()})};
  $('#ppost').onclick=()=>{const x=$('#pcomment');if(x.value.trim())api('/todo/comment',{task_id:openTask,by:'CEO',body:x.value.trim()}).then(()=>{x.value='';return poll()})};
  $('#pfile').onchange=e=>{const files=Array.from(e.target.files);files.forEach(file=>{const form=new FormData();form.append('task_id',openTask);form.append('by','CEO');form.append('file',file,file.name);fetch('/todo/proof',{method:'POST',credentials:'same-origin',body:form}).then(()=>poll())});e.target.value=''};
  $('#createTask').onclick=()=>{const x=$('#newTask');if(x.value.trim())api('/todo/update',{op:'add',text:x.value.trim(),by:'CEO',test:new URL(location.href).searchParams.has('verify')}).then(()=>{x.value='';return poll()})};
  $('#fit').onclick=fit;$('#boss').onclick=centerBoss;$('#closeInspector').onclick=()=>{selected=null;renderInspector()};
  $$('.graph-views button').forEach(b=>b.onclick=()=>applyView(b.dataset.view));$$('[data-layer]').forEach(i=>i.onchange=()=>{layers[i.dataset.layer]=i.checked;saveJson(LAYERKEY,layers);applyVisibility()});$('#resetLayers').onclick=()=>{layers={agents:true,tasks:true,evidence:true,decisions:true,terminals:true};saveJson(LAYERKEY,layers);$$('[data-layer]').forEach(i=>i.checked=true);applyVisibility()};
  $$('.canvas-toolbar .tool').forEach(b=>b.onclick=()=>{activeTool=b.dataset.tool;$$('.canvas-toolbar .tool').forEach(x=>x.classList.toggle('active',x===b));if(activeTool==='frame')fit();if(activeTool==='task')$('#newTask').focus()});
  $('#minimap').onclick=e=>{if(e.target.id==='minimap')centerBoss()};
  const vp=$('#viewport');vp.onpointerdown=e=>{if(e.target.closest('.node,.task-node,#backlogZone'))return;pan={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};vp.classList.add('panning');vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(pan){transform.x=pan.tx+e.clientX-pan.x;transform.y=pan.ty+e.clientY-pan.y;applyWorld();renderMinimap()}};vp.onpointerup=()=>{pan=null;vp.classList.remove('panning')};vp.onwheel=e=>{e.preventDefault();const old=transform.z,n=Math.max(.2,Math.min(2,old*Math.exp(-e.deltaY*.001)));transform.x=e.clientX-(e.clientX-transform.x)*n/old;transform.y=e.clientY-(e.clientY-transform.y)*n/old;transform.z=n;applyWorld();renderMinimap()};
  window.onpopstate=()=>{const id=new URL(location.href).searchParams.get('task');id?openCard(id,false):closeCard(false)};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'){if($('#full').classList.contains('open'))closeFull();else closeCard()}if(e.key.toLowerCase()==='g')fit();if(e.key.toLowerCase()==='b')centerBoss();if(e.key==='0')$('#resetLayers').click()});
  applyWorld();setInterval(poll,2500);poll().then(()=>{fit();const id=new URL(location.href).searchParams.get('task');if(id)openCard(id,false)});
  window.__graph={agentNodes,taskNodes,get graph(){return graph},get transform(){return transform},poll,fit,centerBoss};
  </script>
  <script src="/assets/visual-viewport.js"></script>
</body>
